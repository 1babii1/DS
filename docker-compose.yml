services:
  directory_service:
    container_name: directory_service
    restart: always
    build:
      context: ./backend
      dockerfile: DirectoryService/Dockerfile
    ports:
      - "5129:5129"
      # 5179 (gRPC) is service-to-service only and stays on the compose network.
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - Embeddings__OllamaBaseUrl=http://ollama:11434
      - ConnectionStrings__DirectoryServiceDb=Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=directory,public
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:-changeme-redis}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5129/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      directory_service_migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      ollama_pull:
        condition: service_completed_successfully

  directory_service_migrations:
    container_name: directory_service_migrations
    restart: "no"
    build:
      context: ./backend
      dockerfile: DirectoryService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [
      "/bin/sh",
      "-c",
      './efbundle --connection "Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=directory,public"'
    ]

  auth_service:
    container_name: auth_service
    restart: always
    build:
      context: ./backend
      dockerfile: AuthService/Dockerfile
    ports:
      - "5130:5130"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://*:5130
      - ConnectionStrings__AuthServiceDb=Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=auth,public
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - SigningKeys__SigningKeyBase64=${SIGNINGKEYS_SIGNING_KEY_BASE64:-}
      - SigningKeys__EncryptionKeyBase64=${SIGNINGKEYS_ENCRYPTION_KEY_BASE64:-}
      - Auth__SeedAdmin__Email=${SEED_ADMIN_EMAIL:-admin@portfolio.local}
      - Auth__SeedAdmin__Password=${SEED_ADMIN_PASSWORD:-ChangeMe123!}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5130/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      auth_service_migrations:
        condition: service_completed_successfully

  auth_service_migrations:
    container_name: auth_service_migrations
    restart: "no"
    build:
      context: ./backend
      dockerfile: AuthService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [
      "/bin/sh",
      "-c",
      './efbundle --connection "Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=auth,public"'
    ]

  employee_service:
    container_name: employee_service
    restart: always
    build:
      context: ./backend
      dockerfile: EmployeeService/Dockerfile
    ports:
      - "5131:5131"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://*:5131
      - ConnectionStrings__EmployeeServiceDb=Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=employee,public
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5131/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      employee_service_migrations:
        condition: service_completed_successfully
      directory_service:
        condition: service_started
      auth_service:
        condition: service_started
      kafka:
        condition: service_healthy

  employee_service_migrations:
    container_name: employee_service_migrations
    restart: "no"
    build:
      context: ./backend
      dockerfile: EmployeeService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [
      "/bin/sh",
      "-c",
      './efbundle --connection "Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=employee,public"'
    ]

  audit_service:
    container_name: audit_service
    restart: always
    build:
      context: ./backend
      dockerfile: AuditService/Dockerfile
    ports:
      - "5132:5132"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://*:5132
      - ConnectionStrings__AuditServiceDb=Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=audit,public
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5132/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      audit_service_migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  audit_service_migrations:
    container_name: audit_service_migrations
    restart: "no"
    build:
      context: ./backend
      dockerfile: AuditService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [
      "/bin/sh",
      "-c",
      './efbundle --connection "Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=audit,public"'
    ]

  mcp_server:
    container_name: mcp_server
    restart: always
    build:
      context: ./backend
      dockerfile: McpServer/Dockerfile
    # Порт наружу не публикуется: доступ только через nginx на /mcp, как у остальных
    # сервисов. Опубликованный порт означал вход в обход шлюза.
    expose:
      - "5133"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://*:5133
      - ConnectionStrings__PlatformDb=Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5133/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      auth_service:
        condition: service_started
      directory_service:
        condition: service_started
      employee_service:
        condition: service_started
      ollama_pull:
        condition: service_completed_successfully

  notification_service:
    container_name: notification_service
    restart: always
    build:
      context: ./backend
      dockerfile: NotificationService/Dockerfile
    ports:
      - "5133:5133"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://*:5133
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5133/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka:
    container_name: kafka
    image: apache/kafka:3.9.0
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MTIzNDU2Nzg5MGFiY2RlZg==
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  nginx:
    container_name: nginx
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - directory_service
      - auth_service
      - employee_service
      - audit_service

  postgres:
    container_name: postgres
    image: pgvector/pgvector:pg18
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: platform
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama:
    container_name: ollama
    image: ollama/ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama_pull:
    container_name: ollama_pull
    image: ollama/ollama
    restart: "no"
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    depends_on:
      ollama:
        condition: service_healthy

  redis:
    container_name: redis
    image: redis:alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme-redis}
    # Loopback-only: nothing outside this machine needs Redis directly, and
    # requiring a password is not a reason to also leave it reachable on every
    # network interface - a local Redis GUI/CLI can still reach it via 127.0.0.1.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  # Distributed tracing/metrics/log-correlation stack. Opt-in via
  # `docker compose --profile obs up`: the main services already point at
  # otel-collector unconditionally, but the OTel SDK degrades gracefully
  # (retries quietly, never crashes the host) when it isn't running, so nothing
  # here is required for the rest of the stack to work.
  otel-collector:
    container_name: otel-collector
    profiles: ["obs"]
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config", "/etc/otelcol/otel-collector-config.yaml"]
    volumes:
      - ./docker/otel-collector/otel-collector-config.yaml:/etc/otelcol/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
    restart: always

  tempo:
    container_name: tempo
    profiles: ["obs"]
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./docker/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    restart: always

  loki:
    container_name: loki
    profiles: ["obs"]
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: always

  prometheus:
    container_name: prometheus
    profiles: ["obs"]
    build:
      context: ./docker/prometheus
      dockerfile: Dockerfile
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      otel-collector:
        condition: service_started
    restart: always

  grafana:
    container_name: grafana
    profiles: ["obs"]
    build:
      context: ./docker/grafana
      dockerfile: Dockerfile
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: always

volumes:
  postgres_data:
  redis_data:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
  kafka_data:
  ollama_data: