services:
  directory_service:
    container_name: directory_service
    restart: always
    build:
      context: ./backend
      dockerfile: DirectoryService/Dockerfile
    ports:
      - "5129:5129"
      # 5179 (gRPC) is service-to-service only and stays on the compose network.
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - Embeddings__OllamaBaseUrl=http://ollama:11434
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5129/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      directory_service_migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      ollama_pull:
        condition: service_completed_successfully

  directory_service_migrations:
    container_name: directory_service_migrations
    restart: "no"
    build:
      context: ./backend
      dockerfile: DirectoryService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [
      "/bin/sh",
      "-c",
      './efbundle --connection "Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=postgres;Search Path=directory,public"'
    ]

  auth_service:
    container_name: auth_service
    restart: always
    build:
      context: ./backend
      dockerfile: AuthService/Dockerfile
    ports:
      - "5130:5130"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://*:5130
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5130/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      auth_service_migrations:
        condition: service_completed_successfully

  auth_service_migrations:
    container_name: auth_service_migrations
    restart: "no"
    build:
      context: ./backend
      dockerfile: AuthService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [
      "/bin/sh",
      "-c",
      './efbundle --connection "Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=postgres;Search Path=auth,public"'
    ]

  employee_service:
    container_name: employee_service
    restart: always
    build:
      context: ./backend
      dockerfile: EmployeeService/Dockerfile
    ports:
      - "5131:5131"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://*:5131
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5131/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      employee_service_migrations:
        condition: service_completed_successfully
      directory_service:
        condition: service_started
      auth_service:
        condition: service_started
      kafka:
        condition: service_healthy

  employee_service_migrations:
    container_name: employee_service_migrations
    restart: "no"
    build:
      context: ./backend
      dockerfile: EmployeeService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [
      "/bin/sh",
      "-c",
      './efbundle --connection "Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=postgres;Search Path=employee,public"'
    ]

  audit_service:
    container_name: audit_service
    restart: always
    build:
      context: ./backend
      dockerfile: AuditService/Dockerfile
    ports:
      - "5132:5132"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://*:5132
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5132/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      audit_service_migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  audit_service_migrations:
    container_name: audit_service_migrations
    restart: "no"
    build:
      context: ./backend
      dockerfile: AuditService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [
      "/bin/sh",
      "-c",
      './efbundle --connection "Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=postgres;Search Path=audit,public"'
    ]

  mcp_server:
    container_name: mcp_server
    restart: always
    build:
      context: ./backend
      dockerfile: McpServer/Dockerfile
    # Порт наружу не публикуется: доступ только через nginx на /mcp, как у остальных
    # сервисов. Опубликованный порт означал вход в обход шлюза.
    expose:
      - "5133"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://*:5133
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5133/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      auth_service:
        condition: service_started
      directory_service:
        condition: service_started
      employee_service:
        condition: service_started
      ollama_pull:
        condition: service_completed_successfully

  notification_service:
    container_name: notification_service
    restart: always
    build:
      context: ./backend
      dockerfile: NotificationService/Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Docker
    depends_on:
      kafka:
        condition: service_healthy

  kafka:
    container_name: kafka
    image: apache/kafka:3.9.0
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MTIzNDU2Nzg5MGFiY2RlZg==
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  nginx:
    container_name: nginx
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - directory_service
      - auth_service
      - employee_service
      - audit_service

  postgres:
    container_name: postgres
    image: pgvector/pgvector:pg18
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama:
    container_name: ollama
    image: ollama/ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama_pull:
    container_name: ollama_pull
    image: ollama/ollama
    restart: "no"
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    depends_on:
      ollama:
        condition: service_healthy

  redis:
    container_name: redis
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  
  seq:
    container_name: seq
    image: datalust/seq:latest
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "8081:80"
      - "5341:5341"
    volumes:
      - seq_data:/var/lib/seq
volumes:
  postgres_data:
  seq_data:
  redis_data:
  kafka_data:
  ollama_data: