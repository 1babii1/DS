services:
  directory_service:
    container_name: directory_service
    restart: always
    build:
      context: ./backend
      dockerfile: DirectoryService/Dockerfile
    ports:
      - "5129:5129"
      # 5179 (gRPC) is service-to-service only and stays on the compose network.
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      # Events are Avro (ADR 0023): the schema registry is required, the Kafka topics are the *.events.v2 ones.
      # and every event is also encoded in Avro and published to the *.events.v2 topic. Empty keeps the JSON topics only.
      # Polling (default) or Cdc, with `--profile cdc` (ADR 0030): who delivers the outbox to Kafka.
      - Outbox__Mode=${OUTBOX_MODE:-Polling}
      - SchemaRegistry__Url=${SCHEMA_REGISTRY_URL:-http://schema_registry:8080/apis/ccompat/v7}
      # Optional read replica (ADR 0025, `--profile ha`): e.g. DIRECTORY_READ_DB="Server=postgres_replica;Port=5432;Database=platform;User Id=postgres;Password=...;Search Path=directory,public". Empty = reads use the primary.
      - ConnectionStrings__DirectoryServiceReadDb=${DIRECTORY_READ_DB:-}
      - ConnectionStrings__DirectoryServiceDb=Server=pgbouncer;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=directory,public
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:-changeme-redis}
      - Cors__AllowedOrigins__0=${FRONTEND_ORIGIN:-http://localhost:3000}
      - Kafka__SaslUsername=kafka
      - Kafka__SaslPassword=${KAFKA_PASSWORD:-changeme-kafka}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5129/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      directory_service_migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  directory_service_migrations:
    container_name: directory_service_migrations
    restart: "no"
    build:
      context: ./backend
      dockerfile: DirectoryService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [
      "/bin/sh",
      "-c",
      './efbundle --connection "Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=directory,public"'
    ]

  auth_service:
    container_name: auth_service
    restart: always
    build:
      context: ./backend
      dockerfile: AuthService/Dockerfile
    ports:
      - "5130:5130"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - Kafka__Topics__0=employee.events.v2
      # Events are Avro (ADR 0023): the schema registry is required, the Kafka topics are the *.events.v2 ones.
      # and every event is also encoded in Avro and published to the *.events.v2 topic. Empty keeps the JSON topics only.
      # Polling (default) or Cdc, with `--profile cdc` (ADR 0030): who delivers the outbox to Kafka.
      - Outbox__Mode=${OUTBOX_MODE:-Polling}
      - SchemaRegistry__Url=${SCHEMA_REGISTRY_URL:-http://schema_registry:8080/apis/ccompat/v7}
      - ASPNETCORE_URLS=http://*:5130
      - ConnectionStrings__AuthServiceDb=Server=pgbouncer;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=auth,public
      - Cors__AllowedOrigins__0=${FRONTEND_ORIGIN:-http://localhost:3000}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - SigningKeys__SigningKeyBase64=${SIGNINGKEYS_SIGNING_KEY_BASE64:-}
      - SigningKeys__EncryptionKeyBase64=${SIGNINGKEYS_ENCRYPTION_KEY_BASE64:-}
      - SigningKeys__AtRestKeyBase64=${SIGNINGKEYS_AT_REST_KEY_BASE64:-}
      - Auth__SeedAdmin__Email=${SEED_ADMIN_EMAIL:-admin@portfolio.local}
      - Auth__SeedAdmin__Password=${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      - Email__SmtpHost=${EMAIL_SMTP_HOST:-mailpit}
      - Email__SmtpPort=${EMAIL_SMTP_PORT:-1025}
      - Email__UseSsl=${EMAIL_SMTP_USE_SSL:-false}
      - Email__SmtpUsername=${EMAIL_SMTP_USERNAME:-}
      - Email__SmtpPassword=${EMAIL_SMTP_PASSWORD:-}
      - Email__FromAddress=${EMAIL_FROM_ADDRESS:-no-reply@portfolio.local}
      - Kafka__SaslUsername=kafka
      - Kafka__SaslPassword=${KAFKA_PASSWORD:-changeme-kafka}
      - Auth__WebClient__Enabled=true
      - Auth__WebClient__FrontendOrigin=${AUTH_WEB_CLIENT_FRONTEND_ORIGIN:-http://localhost:3000}
      - Auth__WebClient__ClientSecret=${AUTH_OIDC_CLIENT_SECRET:?AUTH_OIDC_CLIENT_SECRET must be set}
      - Auth__Google__ClientId=${AUTH_GOOGLE_CLIENT_ID:-}
      - Auth__Google__ClientSecret=${AUTH_GOOGLE_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5130/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      auth_service_migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  auth_service_migrations:
    container_name: auth_service_migrations
    restart: "no"
    build:
      context: ./backend
      dockerfile: AuthService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [
      "/bin/sh",
      "-c",
      './efbundle --connection "Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=auth,public"'
    ]

  employee_service:
    container_name: employee_service
    restart: always
    build:
      context: ./backend
      dockerfile: EmployeeService/Dockerfile
    ports:
      - "5131:5131"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - Kafka__Topics__0=auth.events.v2
      - Kafka__Topics__1=rewards.events.v2
      # Events are Avro (ADR 0023): the schema registry is required, the Kafka topics are the *.events.v2 ones.
      # and every event is also encoded in Avro and published to the *.events.v2 topic. Empty keeps the JSON topics only.
      # Polling (default) or Cdc, with `--profile cdc` (ADR 0030): who delivers the outbox to Kafka.
      - Outbox__Mode=${OUTBOX_MODE:-Polling}
      - SchemaRegistry__Url=${SCHEMA_REGISTRY_URL:-http://schema_registry:8080/apis/ccompat/v7}
      - ASPNETCORE_URLS=http://*:5131
      - ConnectionStrings__EmployeeServiceDb=Server=pgbouncer;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=employee,public
      - Cors__AllowedOrigins__0=${FRONTEND_ORIGIN:-http://localhost:3000}
      - Kafka__SaslUsername=kafka
      - Kafka__SaslPassword=${KAFKA_PASSWORD:-changeme-kafka}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5131/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      employee_service_migrations:
        condition: service_completed_successfully
      directory_service:
        condition: service_started
      auth_service:
        condition: service_started
      kafka:
        condition: service_healthy

  employee_service_migrations:
    container_name: employee_service_migrations
    restart: "no"
    build:
      context: ./backend
      dockerfile: EmployeeService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [
      "/bin/sh",
      "-c",
      './efbundle --connection "Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=employee,public"'
    ]

  audit_service:
    container_name: audit_service
    restart: always
    build:
      context: ./backend
      dockerfile: AuditService/Dockerfile
    ports:
      - "5132:5132"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      # Events are Avro (ADR 0023): the schema registry is required, the Kafka topics are the *.events.v2 ones.
      - SchemaRegistry__Url=${SCHEMA_REGISTRY_URL:-http://schema_registry:8080/apis/ccompat/v7}
      - Kafka__Topics__0=directory.events.v2
      - Kafka__Topics__1=employee.events.v2
      - ASPNETCORE_URLS=http://*:5132
      - ConnectionStrings__AuditServiceDb=Server=pgbouncer;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=audit,public
      - Cors__AllowedOrigins__0=${FRONTEND_ORIGIN:-http://localhost:3000}
      - Kafka__SaslUsername=kafka
      - Kafka__SaslPassword=${KAFKA_PASSWORD:-changeme-kafka}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5132/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      audit_service_migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  audit_service_migrations:
    container_name: audit_service_migrations
    restart: "no"
    build:
      context: ./backend
      dockerfile: AuditService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [
      "/bin/sh",
      "-c",
      './efbundle --connection "Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=audit,public"'
    ]

  rewards_service:
    container_name: rewards_service
    restart: always
    build:
      context: ./backend
      dockerfile: RewardsService/Dockerfile
    ports:
      - "5134:5134"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - Kafka__Topics__0=employee.events.v2
      - Kafka__Topics__1=auth.events.v2
      # Events are Avro (ADR 0023): the schema registry is required, the Kafka topics are the *.events.v2 ones.
      # and every event is also encoded in Avro and published to the *.events.v2 topic. Empty keeps the JSON topics only.
      # Polling (default) or Cdc, with `--profile cdc` (ADR 0030): who delivers the outbox to Kafka.
      - Outbox__Mode=${OUTBOX_MODE:-Polling}
      - SchemaRegistry__Url=${SCHEMA_REGISTRY_URL:-http://schema_registry:8080/apis/ccompat/v7}
      - ASPNETCORE_URLS=http://*:5134
      - ConnectionStrings__RewardsServiceDb=Server=pgbouncer;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=rewards,public
      - Cors__AllowedOrigins__0=${FRONTEND_ORIGIN:-http://localhost:3000}
      - Kafka__SaslUsername=kafka
      - Kafka__SaslPassword=${KAFKA_PASSWORD:-changeme-kafka}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5134/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      rewards_service_migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  rewards_service_migrations:
    container_name: rewards_service_migrations
    restart: "no"
    build:
      context: ./backend
      dockerfile: RewardsService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [
      "/bin/sh",
      "-c",
      './efbundle --connection "Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=rewards,public"'
    ]

  search_service:
    container_name: search_service
    restart: always
    build:
      context: ./backend
      dockerfile: SearchService/Dockerfile
    ports:
      - "5135:5135"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      # Events are Avro (ADR 0023): the schema registry is required, the Kafka topics are the *.events.v2 ones.
      - SchemaRegistry__Url=${SCHEMA_REGISTRY_URL:-http://schema_registry:8080/apis/ccompat/v7}
      - Kafka__Topics__0=directory.events.v2
      - Kafka__Topics__1=employee.events.v2
      - Kafka__Topics__2=auth.events.v2
      - Kafka__Topics__3=rewards.events.v2
      - ASPNETCORE_URLS=http://*:5135
      - ConnectionStrings__SearchServiceDb=Server=pgbouncer;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=search,public
      - Elasticsearch__Uri=http://elasticsearch:9200
      - Cors__AllowedOrigins__0=${FRONTEND_ORIGIN:-http://localhost:3000}
      - Kafka__SaslUsername=kafka
      - Kafka__SaslPassword=${KAFKA_PASSWORD:-changeme-kafka}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5135/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      search_service_migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  search_service_migrations:
    container_name: search_service_migrations
    restart: "no"
    build:
      context: ./backend
      dockerfile: SearchService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [
      "/bin/sh",
      "-c",
      './efbundle --connection "Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=search,public"'
    ]

  # Single-node dev setup - security disabled the same way Kafka's own SASL/PLAIN setup
  # is dev-appropriate rather than production-hardened. Only SearchService talks to it.
  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    restart: always
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      # Dev machines routinely sit above ES's default 85%/90%/95% disk watermarks long
      # before actually running out of space (build caches, other containers' volumes) -
      # without this, shard allocation silently refuses and the cluster goes red with no
      # actionable log line pointing at "disk usage", not "index is broken".
      cluster.routing.allocation.disk.watermark.low: "95%"
      cluster.routing.allocation.disk.watermark.high: "97%"
      cluster.routing.allocation.disk.watermark.flood_stage: "98%"
    # Loopback-only, same reasoning as redis/kafka: every consumer reaches this over the
    # docker network via the "elasticsearch" hostname - published only for local debugging.
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  mcp_server:
    container_name: mcp_server
    restart: always
    build:
      context: ./backend
      dockerfile: McpServer/Dockerfile
    # Порт наружу не публикуется: доступ только через nginx на /mcp, как у остальных
    # сервисов. Опубликованный порт означал вход в обход шлюза.
    expose:
      - "5133"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://*:5133
      - Services__Directory__BaseUrl=http://directory_service:5129/
      - Services__Employee__BaseUrl=http://employee_service:5131/
      - Services__Audit__BaseUrl=http://audit_service:5132/
      - Services__Rewards__BaseUrl=http://rewards_service:5134/
      - Agent__SigningKeyBase64=${AGENT_PLAN_SIGNING_KEY_BASE64:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5133/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      auth_service:
        condition: service_started
      directory_service:
        condition: service_started
      employee_service:
        condition: service_started
      rewards_service:
        condition: service_started

  notification_service:
    container_name: notification_service
    restart: always
    build:
      context: ./backend
      dockerfile: NotificationService/Dockerfile
    ports:
      - "5133:5133"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      # Events are Avro (ADR 0023): the schema registry is required, the Kafka topics are the *.events.v2 ones.
      - SchemaRegistry__Url=${SCHEMA_REGISTRY_URL:-http://schema_registry:8080/apis/ccompat/v7}
      - Kafka__Topics__0=rewards.events.v2
      - Kafka__Topics__1=auth.events.v2
      - Kafka__Topics__2=employee.events.v2
      - ASPNETCORE_URLS=http://*:5133
      - ConnectionStrings__NotificationServiceDb=Server=pgbouncer;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=notification,public
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:-changeme-redis}
      - Cors__AllowedOrigins__0=${FRONTEND_ORIGIN:-http://localhost:3000}
      - Kafka__SaslUsername=kafka
      - Kafka__SaslPassword=${KAFKA_PASSWORD:-changeme-kafka}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5133/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      notification_service_migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  notification_service_migrations:
    container_name: notification_service_migrations
    restart: "no"
    build:
      context: ./backend
      dockerfile: NotificationService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [
      "/bin/sh",
      "-c",
      './efbundle --connection "Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=${POSTGRES_PASSWORD:-postgres};Search Path=notification,public"'
    ]

  kafka:
    container_name: kafka
    image: apache/kafka:3.9.0
    restart: always
    # Loopback-only, same reasoning as redis: every consumer/producer in this
    # stack reaches Kafka over the docker network via the "kafka" hostname,
    # not through this published port - it exists only for a local CLI/GUI
    # to inspect topics from the host.
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: SASL_PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MTIzNDU2Nzg5MGFiY2RlZg==
    # kafka_jaas (below) defines the single shared "kafka" account (no ACLs, no
    # per-service identity - proportional to a single-broker deployment with no
    # external access) that both this broker's own KafkaServer login context and
    # every producer/consumer authenticate with.
    configs:
      - source: kafka_jaas
        target: /etc/kafka/secrets/kafka_server_jaas.conf
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          printf 'security.protocol=SASL_PLAINTEXT\nsasl.mechanism=PLAIN\nsasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="kafka" password="${KAFKA_PASSWORD:-changeme-kafka}";\n'
          > /tmp/health-client.properties &&
          /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 --command-config /tmp/health-client.properties
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  nginx:
    container_name: nginx
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - directory_service
      - auth_service
      - employee_service
      - audit_service
      - rewards_service
      - notification_service
      - search_service

  postgres:
    container_name: postgres
    image: pgvector/pgvector:pg18
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: platform
    # hba_file: the image's rules plus one that lets a standby stream WAL (ADR 0025).
    # wal_level=logical lets Debezium read the outbox tables from the log (ADR 0030); a physical standby still works with it.
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=20"]
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Read replica of `postgres` (ADR 0025): a streaming standby. Opt-in, `--profile ha`. Services that can read from it are
  # pointed at it with <Service>ReadDb connection strings; nothing else changes. REPLICA_APPLY_DELAY holds replay back on
  # purpose (e.g. 5s) to make lag visible.
  postgres_replica:
    container_name: postgres_replica
    profiles: ["ha"]
    image: pgvector/pgvector:pg18
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REPLICA_APPLY_DELAY: ${REPLICA_APPLY_DELAY:-0}
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    ports:
      - "5435:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql
      - ./docker/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  # Connection pooler in front of Postgres (ADR 0024). Services hold many client connections (each instance has its own
  # Npgsql pool); Postgres can only afford a few real ones, each a whole process. In transaction mode a server connection
  # belongs to a client only for the length of a transaction, so a few dozen real connections serve hundreds of clients and
  # the rest wait in PgBouncer's queue instead of making Postgres refuse them. Migrations connect directly: they take
  # session-level locks, which transaction pooling does not keep.
  pgbouncer:
    container_name: pgbouncer
    restart: always
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      # Npgsql sends search_path as a startup parameter (DirectoryService's Dapper queries rely on it); the pooler has to
      # track it or it would be silently dropped when a server connection changes hands.
      TRACK_EXTRA_PARAMETERS: IntervalStyle,search_path
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      MAX_PREPARED_STATEMENTS: "100"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    container_name: ollama
    image: ollama/ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama_pull:
    container_name: ollama_pull
    image: ollama/ollama
    restart: "no"
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    depends_on:
      ollama:
        condition: service_healthy

  redis:
    container_name: redis
    image: redis:alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme-redis}
    # Loopback-only: nothing outside this machine needs Redis directly, and
    # requiring a password is not a reason to also leave it reachable on every
    # network interface - a local Redis GUI/CLI can still reach it via 127.0.0.1.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  # Local SMTP catch-all: AuthService always has somewhere to send account-
  # provisioning emails without needing real Yandex credentials for local/docker
  # use. Point EMAIL_SMTP_HOST at the real provider (see .env.example) to send for
  # real; mail sent here never leaves the host - view it at localhost:8025.
  mailpit:
    container_name: mailpit
    image: axllent/mailpit
    restart: always
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Schema registry for the event contracts (ADR 0023). Events travel as Avro and every message carries the id of its
  # schema, so the registry has to remember: it stores in its own database (`registry`) on the shared Postgres, and an
  # empty registry would make every message already in Kafka unreadable. registry_db_init creates the database once
  # (init-databases.sql only runs on a fresh volume).
  registry_db_init:
    container_name: registry_db_init
    restart: "no"
    image: pgvector/pgvector:pg18
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    entrypoint:
      - sh
      - -c
      - >-
        psql -h postgres -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='registry'" | grep -q 1
        || psql -h postgres -U postgres -c "CREATE DATABASE registry"
    depends_on:
      postgres:
        condition: service_healthy

  schema_registry:
    container_name: schema_registry
    restart: always
    image: quay.io/apicurio/apicurio-registry:3.0.7
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: postgresql
      APICURIO_DATASOURCE_URL: jdbc:postgresql://postgres:5432/registry
      APICURIO_DATASOURCE_USERNAME: postgres
      APICURIO_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      registry_db_init:
        condition: service_completed_successfully

  # Change data capture of the outbox tables (ADR 0030). Opt-in, `--profile cdc`, together with OUTBOX_MODE=Cdc for the
  # four producing services: Debezium reads each outbox table's write-ahead log and produces its Avro bytes to the service's
  # *.events.v2 topic, so the services' own polling publishers are off. Never run both for the same service: every event would be
  # sent twice.
  kafka_connect:
    container_name: kafka_connect
    profiles: ["cdc"]
    image: quay.io/debezium/connect:3.0
    restart: always
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_SASL_MECHANISM: PLAIN
      CONNECT_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="kafka" password="${KAFKA_PASSWORD:-changeme-kafka}";
      CONNECT_PRODUCER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_PRODUCER_SASL_MECHANISM: PLAIN
      CONNECT_PRODUCER_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="kafka" password="${KAFKA_PASSWORD:-changeme-kafka}";
      CONNECT_CONSUMER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_CONSUMER_SASL_MECHANISM: PLAIN
      CONNECT_CONSUMER_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="kafka" password="${KAFKA_PASSWORD:-changeme-kafka}";
      CONNECT_ADMIN_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_ADMIN_SASL_MECHANISM: PLAIN
      CONNECT_ADMIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="kafka" password="${KAFKA_PASSWORD:-changeme-kafka}";
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  kafka_connect_setup:
    container_name: kafka_connect_setup
    profiles: ["cdc"]
    restart: "no"
    image: curlimages/curl:8.10.1
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CONNECT_URL: http://kafka_connect:8083
    entrypoint: ["/bin/sh", "/register-connectors.sh"]
    volumes:
      - ./docker/debezium/register-connectors.sh:/register-connectors.sh:ro
    depends_on:
      - kafka_connect

  # Distributed tracing/metrics/log-correlation stack. Opt-in via
  # `docker compose --profile obs up`: the main services already point at
  # otel-collector unconditionally, but the OTel SDK degrades gracefully
  # (retries quietly, never crashes the host) when it isn't running, so nothing
  # here is required for the rest of the stack to work.
  otel-collector:
    container_name: otel-collector
    profiles: ["obs"]
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config", "/etc/otelcol/otel-collector-config.yaml"]
    volumes:
      - ./docker/otel-collector/otel-collector-config.yaml:/etc/otelcol/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
    restart: always

  tempo:
    container_name: tempo
    profiles: ["obs"]
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./docker/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    restart: always

  loki:
    container_name: loki
    profiles: ["obs"]
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: always

  prometheus:
    container_name: prometheus
    profiles: ["obs"]
    build:
      context: ./docker/prometheus
      dockerfile: Dockerfile
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      otel-collector:
        condition: service_started
    restart: always

  grafana:
    container_name: grafana
    profiles: ["obs"]
    build:
      context: ./docker/grafana
      dockerfile: Dockerfile
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: always

configs:
  # Kafka's own startup validates the inter-broker listener's JAAS config eagerly -
  # even for a single-node broker with no peer to replicate to - so this KafkaServer
  # entry has to exist, on top of the per-listener PLAIN config set directly as a
  # broker property below. Compose interpolates KAFKA_PASSWORD into this content at
  # `up` time; nothing secret is written to disk in the repo.
  kafka_jaas:
    content: |
      KafkaServer {
         org.apache.kafka.common.security.plain.PlainLoginModule required
         username="kafka"
         password="${KAFKA_PASSWORD:-changeme-kafka}"
         user_kafka="${KAFKA_PASSWORD:-changeme-kafka}";
      };

volumes:
  postgres_data:
  postgres_replica_data:
  redis_data:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
  kafka_data:
  ollama_data:
  elasticsearch_data:
