services:
  directory_service:
    container_name: directory_service
    restart: always
    build:
      context: ./backend
      dockerfile: DirectoryService/Dockerfile
    ports:
      - "5129:5129"
      - "5179:5179"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      postgres: 
        condition: service_healthy
      directory_service_migrations:
        condition: service_completed_successfully

  directory_service_migrations:
    container_name: directory_service_migrations
    restart: "no"
    build:
      context: ./backend
      dockerfile: DirectoryService/Dockerfile
    depends_on:
      postgres: 
        condition: service_healthy
    entrypoint: [
      "/bin/sh",
      "-c",
      './efbundle --connection "Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=postgres;Search Path=directory,public"'
    ]

  auth_service:
    container_name: auth_service
    restart: always
    build:
      context: ./backend
      dockerfile: AuthService/Dockerfile
    ports:
      - "5130:5130"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://*:5130
    depends_on:
      postgres:
        condition: service_healthy
      auth_service_migrations:
        condition: service_completed_successfully

  auth_service_migrations:
    container_name: auth_service_migrations
    restart: "no"
    build:
      context: ./backend
      dockerfile: AuthService/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [
      "/bin/sh",
      "-c",
      './efbundle --connection "Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=postgres;Search Path=auth,public"'
    ]

  employee_service:
    container_name: employee_service
    restart: always
    build:
      context: ./backend
      dockerfile: EmployeeService/Dockerfile
    ports:
      - "5131:5131"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://*:5131
    depends_on:
      postgres:
        condition: service_healthy
      employee_service_migrations:
        condition: service_completed_successfully
      directory_service:
        condition: service_started
      auth_service:
        condition: service_started

  employee_service_migrations:
    container_name: employee_service_migrations
    restart: "no"
    build:
      context: ./backend
      dockerfile: EmployeeService/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [
      "/bin/sh",
      "-c",
      './efbundle --connection "Server=postgres;Port=5432;Database=platform;User Id=postgres;Password=postgres;Search Path=employee,public"'
    ]

  nginx:
    container_name: nginx
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - directory_service
      - auth_service
      - employee_service

  postgres:
    container_name: postgres
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    container_name: redis
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  
  seq:
    container_name: seq
    image: datalust/seq:latest
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "8081:80"
      - "5341:5341"
    volumes:
      - seq_data:/var/lib/seq
volumes:
  postgres_data:
  seq_data:
  redis_data: