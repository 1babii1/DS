events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker's embedded DNS. Without this, proxy_pass to a plain hostname
    # resolves once at startup and nginx keeps using that IP forever - if the
    # target container is later recreated (a new deploy, a compose restart of
    # just that service) it gets a new IP and nginx starts returning 502s
    # until nginx itself is restarted. Using a variable in proxy_pass forces
    # nginx to re-resolve through this resolver on every request instead.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name localhost;

        # Longest matching prefix wins, so /api/employees is picked over /api below.
        location /api/employees {
            set $upstream_employee employee_service;
            proxy_pass http://$upstream_employee:5131;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MCP использует Streamable HTTP: ответ приходит потоком, поэтому буферизацию
        # нужно выключить, иначе nginx придержит его до завершения.
        location /mcp {
            set $upstream_mcp mcp_server;
            proxy_pass http://$upstream_mcp:5133;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/rewards {
            set $upstream_rewards rewards_service;
            proxy_pass http://$upstream_rewards:5134;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/audit {
            set $upstream_audit audit_service;
            proxy_pass http://$upstream_audit:5132;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api {
            set $upstream_directory directory_service;
            proxy_pass http://$upstream_directory:5129;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OIDC endpoints have no /api prefix, unlike the other services.
        location /auth {
            set $upstream_auth auth_service;
            proxy_pass http://$upstream_auth:5130;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /connect {
            set $upstream_auth auth_service;
            proxy_pass http://$upstream_auth:5130;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /.well-known {
            set $upstream_auth auth_service;
            proxy_pass http://$upstream_auth:5130;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
