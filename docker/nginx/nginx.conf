events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker's embedded DNS. Without this, proxy_pass to a plain hostname
    # resolves once at startup and nginx keeps using that IP forever - if the
    # target container is later recreated (a new deploy, a compose restart of
    # just that service) it gets a new IP and nginx starts returning 502s
    # until nginx itself is restarted. Using a variable in proxy_pass forces
    # nginx to re-resolve through this resolver on every request instead.
    resolver 127.0.0.11 valid=10s;

    # SignalR can't set an Authorization header on a WebSocket upgrade, so its JWT arrives
    # as ?access_token=... - and nginx's default "combined" format logs $request verbatim,
    # which would write live, replayable tokens into the access log (and from there into
    # Loki). Mask the value rather than dropping the log line: the request is still useful.
    # Any request carrying a token logs its path with the whole query string replaced -
    # the only requests that do are SignalR handshakes, where the rest of the query string
    # carries nothing worth keeping.
    map $request_uri $request_uri_masked {
        "~access_token="  "$uri?access_token=REDACTED";
        default           $request_uri;
    }

    log_format masked '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $request_uri_masked $server_protocol" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log masked;

    # The client address is the one the BFF forwarded in X-Forwarded-For, trusted only from private (compose/cluster) addresses, so
    # that limits count per user and not for the whole frontend together. A caller from outside those ranges cannot choose its address.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Rate limits at the one ingress (ADR 0039). The services each limit per client address too, but each instance counts only
    # what reaches it: with three instances behind a balancer the real limit is three times the configured one. nginx sees every
    # request before it is spread across instances, so a limit here is a limit on the whole fleet. The numbers repeat the services'
    # defaults (RateLimiting:Write 30 per minute, RateLimiting:Auth 5 per minute) and have to be kept in step with them by hand.
    # An empty key is not counted: reads are not limited here, and neither is anything but a POST to the auth endpoints.
    map $request_method $edge_write_addr {
        GET      "";
        HEAD     "";
        OPTIONS  "";
        default  $binary_remote_addr;
    }

    # One budget per client per service (/api/employees, /api/rewards, ...), as when each service counted its own.
    map $uri $edge_service {
        "~^/api/(?<svc>[a-z]+)"  $svc;
        default                  other;
    }

    map $edge_write_addr $edge_write_key {
        ""       "";
        default  "$edge_write_addr$edge_service";
    }

    map $request_method $edge_auth_key {
        POST     $binary_remote_addr;
        default  "";
    }

    limit_req_zone $edge_write_key zone=edge_write:10m rate=30r/m;
    limit_req_zone $edge_auth_key zone=edge_auth:10m rate=5r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    # SignalR's WebSocket upgrade needs the Connection header forwarded as "upgrade" only
    # when the client actually asked to upgrade - a plain HTTP request must keep getting
    # nginx's normal keep-alive Connection header, not "upgrade" unconditionally.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;

        # Every write to a service counts against one budget per client for that service. Locations that name their own limit_req (the auth
        # endpoints) use that instead: limit_req is inherited only by locations that have none of their own.
        limit_req zone=edge_write burst=10 nodelay;

        # Longest matching prefix wins, so /api/employees is picked over /api below.
        location /api/employees {
            set $upstream_employee employee_service;
            proxy_pass http://$upstream_employee:5131;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MCP использует Streamable HTTP: ответ приходит потоком, поэтому буферизацию
        # нужно выключить, иначе nginx придержит его до завершения.
        location /mcp {
            set $upstream_mcp mcp_server;
            proxy_pass http://$upstream_mcp:5133;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/search {
            set $upstream_search search_service;
            proxy_pass http://$upstream_search:5135;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/rewards {
            set $upstream_rewards rewards_service;
            proxy_pass http://$upstream_rewards:5134;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/notifications {
            set $upstream_notification notification_service;
            proxy_pass http://$upstream_notification:5133;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SignalR: long-lived WebSocket connections, so the read timeout is much longer
        # than every other proxied location here.
        location /hub/notifications {
            set $upstream_notification notification_service;
            proxy_pass http://$upstream_notification:5133;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/audit {
            set $upstream_audit audit_service;
            proxy_pass http://$upstream_audit:5132;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api {
            set $upstream_directory directory_service;
            proxy_pass http://$upstream_directory:5129;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OIDC endpoints have no /api prefix, unlike the other services.
        location /auth {
            limit_req zone=edge_auth burst=3 nodelay;
            set $upstream_auth auth_service;
            proxy_pass http://$upstream_auth:5130;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /connect {
            limit_req zone=edge_auth burst=3 nodelay;
            set $upstream_auth auth_service;
            proxy_pass http://$upstream_auth:5130;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /.well-known {
            set $upstream_auth auth_service;
            proxy_pass http://$upstream_auth:5130;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
