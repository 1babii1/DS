# A three-broker Kafka cluster (KRaft, every node both broker and controller) for the replication drill (ADR 0035).
# Separate from the main stack, which runs one broker with SASL; this one is plaintext because the drill is about
# replication, not authentication. Run with scripts/kafka-ha-drill.sh.
name: kafka-ha

x-broker: &broker
  image: apache/kafka:3.9.0
  environment: &env
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
    CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    # The cluster-wide defaults a topic inherits unless it says otherwise: three copies, two of them in sync.
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

services:
  kafka1:
    <<: *broker
    container_name: kafka1
    hostname: kafka1
    environment:
      <<: *env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
  kafka2:
    <<: *broker
    container_name: kafka2
    hostname: kafka2
    environment:
      <<: *env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092
  kafka3:
    <<: *broker
    container_name: kafka3
    hostname: kafka3
    environment:
      <<: *env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092
  # A client that is never killed, so the producer and the consumer of the drill outlive any broker.
  client:
    image: apache/kafka:3.9.0
    container_name: kafka_client
    command: sleep infinity
