  - name: slo-burn-alerts
    rules:
      - alert: JourneyAvailabilityBudgetBurnFast
        expr: journey:availability_error_ratio:rate1h > 14.4 * 0.005 and journey:availability_error_ratio:rate5m > 14.4 * 0.005
