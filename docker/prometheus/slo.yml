        annotations:
          summary: "Availability of journey {{ $labels.journey }} is burning its error budget 14.4x too fast"
          description: "SLO 99.5%. At this rate 2% of the 30-day budget is gone in an hour."
      - alert: JourneyAvailabilityBudgetBurnSlow
        expr: journey:availability_error_ratio:rate6h > 6.0 * 0.005 and journey:availability_error_ratio:rate30m > 6.0 * 0.005
        labels: {severity: ticket}
