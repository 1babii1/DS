# Postgres and PgBouncer (transaction mode, one server connection) for the row-level-security drill (ADR 0042). The pooler's single
# server connection is what makes the leak below easy to see: every client uses the same one in turn.
name: rls-drill

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: drillpw
      POSTGRES_DB: platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 2s
      retries: 20
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_USER: app
      DB_PASSWORD: apppw
      DB_NAME: platform
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "1"
      MAX_CLIENT_CONN: "100"
    depends_on:
      postgres:
        condition: service_healthy
