{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform
  labels:
    app.kubernetes.io/part-of: platform
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          {{- range $name, $on := .Values.enabled }}
          {{- if $on }}
          {{- $s := include "platform.service" (dict "root" $ "name" $name) | fromYaml }}
          {{- range (concat (list $s.ingressPrefix) (default (list) $s.extraIngressPrefixes)) }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $s.port }}
          {{- end }}
          {{- end }}
          {{- end }}
{{- end }}
