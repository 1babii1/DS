{{- range $name, $on := .Values.enabled }}
{{- if $on }}
{{- $s := include "platform.service" (dict "root" $ "name" $name) | fromYaml }}
---
{{- /* With an autoscaler the replica count is its to decide; setting it here too would reset it on every upgrade. */}}
{{ include "platform.deployment" (dict "root" $ "name" $name "s" $s "track" "stable" "tag" $s.image.tag "replicas" $s.replicas "withReplicas" (not $s.hpa.enabled)) }}
{{- if and $s.canary $s.canary.enabled }}
---
{{ include "platform.deployment" (dict "root" $ "name" $name "s" $s "track" "canary" "tag" $s.canary.tag "replicas" $s.canary.replicas "withReplicas" true) }}
{{- end }}
{{- end }}
{{- end }}
