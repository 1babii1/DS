name: CI

on:
  push:
    branches: [main]
  pull_request:

# Одна ветка - один прогон: новый push отменяет предыдущий, ещё не завершившийся.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore backend/backend.slnx

      - name: Build
        run: dotnet build backend/backend.slnx --no-restore --configuration Release

      # Интеграционные тесты поднимают Postgres через Testcontainers, Docker на
      # ubuntu-раннере есть из коробки. Другой инфраструктуры тесты не требуют:
      # фоновые сервисы из тестового хоста удалены, а запись в кэш после коммита
      # не обязана удаваться.
      - name: Test
        run: dotnet test backend/backend.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  docker:
    name: Build images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Образы только собираются, никуда не публикуются: цель - поймать поломку
    # Dockerfile (например, базовый образ без ASP.NET runtime) до docker compose up.
    strategy:
      fail-fast: false
      matrix:
        service:
          - AuditService
          - AuthService
          - DirectoryService
          - EmployeeService
          - McpServer
          - NotificationService

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
