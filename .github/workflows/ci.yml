name: CI

on:
  push:
    branches: [main]
  pull_request:

# Одна ветка - один прогон: новый push отменяет предыдущий, ещё не завершившийся.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore backend/backend.slnx

      - name: Build
        run: dotnet build backend/backend.slnx --no-restore --configuration Release

      # Интеграционные тесты поднимают Postgres через Testcontainers, Docker на
      # ubuntu-раннере есть из коробки. Другой инфраструктуры тесты не требуют:
      # фоновые сервисы из тестового хоста удалены, а запись в кэш после коммита
      # не обязана удаваться.
      - name: Test
        run: dotnet test backend/backend.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  docker:
    name: Build images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Образы только собираются, никуда не публикуются: цель - поймать поломку
    # Dockerfile (например, базовый образ без ASP.NET runtime) до docker compose up.
    strategy:
      fail-fast: false
      matrix:
        service:
          - AuditService
          - AuthService
          - DirectoryService
          - EmployeeService
          - McpServer
          - NotificationService
          - RewardsService
          - SearchService

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Event schemas (ADR 0023): a schema may only grow compatibly. A throwaway registry is started, the schemas released
  # on the base branch are registered in order, then this change's; any that cannot be registered, any removed field and
  # any deleted schema fail the job. The script also proves the gate is alive by registering a deliberately breaking
  # schema and requiring the registry to refuse it.
  event-schemas:
    name: Event schema compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      registry:
        image: quay.io/apicurio/apicurio-registry:3.0.7
        ports:
          - 8081:8080

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for the registry
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:8081/apis/registry/v3/system/info && exit 0
            sleep 3
          done
          echo "registry did not start" >&2
          exit 1

      - name: Check schema compatibility against the base branch
        run: python3 scripts/check_schemas.py --registry http://localhost:8081/apis/ccompat/v7 --base origin/${{ github.base_ref || 'main' }}

  # The Helm chart (ADR 0040) is rendered in the shapes people use it and every rendered resource is checked against the Kubernetes
  # schemas. A chart nobody renders in CI drifts from the services it describes.
  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Lint and validate
        run: scripts/check-chart.sh
